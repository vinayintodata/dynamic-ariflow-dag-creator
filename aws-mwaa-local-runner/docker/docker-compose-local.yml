# Patched for LocalStack: join external network `awslocal` so `local-runner` can reach `localstack:4566`.
# Start LocalStack first from the parent docker_mwaa project: docker compose up -d

services:
  postgres:
    image: postgres:13-alpine
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    logging:
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - "${PWD}/db-data:/var/lib/postgresql/data"
    networks:
      - default
      - awslocal

  local-runner:
    image: vinayram21/mwaa-custom-env:latest
    restart: always
    depends_on:
      - postgres
    environment:
      - LOAD_EX=n
      - EXECUTOR=Local
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      - LOCALSTACK_ENDPOINT_URL=http://localstack:4566
    logging:
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - "../dags:/usr/local/airflow/dags"
      - "../plugins:/usr/local/airflow/plugins"
      - "../requirements:/usr/local/airflow/requirements"
      - "../startup_script:/usr/local/airflow/startup"
    ports:
      - "127.0.0.1:8080:8080"
    command: local-runner
    healthcheck:
      test: ["CMD-SHELL", "[ -f /usr/local/airflow/airflow-webserver.pid ]"]
      interval: 30s
      timeout: 30s
      retries: 3
    env_file:
      - ./config/.env.localrunner
    networks:
      - default
      - awslocal

networks:
  awslocal:
    external: true
    name: awslocal
